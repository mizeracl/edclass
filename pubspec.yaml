name: edclass
description: "Online education platform with video calls, calendar and drawing"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.0
  cached_network_image: ^3.4.0
  shimmer: ^3.0.0
  gap: ^3.0.0

  # State Management
  flutter_riverpod: ^2.6.0
  riverpod_annotation: ^2.6.0

  # Navigation
  go_router: ^14.8.0

  # Network
  dio: ^5.8.0
  web_socket_channel: ^3.0.0

  # Firebase
  firebase_core: ^3.9.0
  firebase_auth: ^5.4.0
  firebase_messaging: ^15.2.0
  cloud_firestore: ^5.6.0

  # Video Calls
  flutter_webrtc: ^0.12.0
  dart_webrtc: ^1.8.0
  web: ^1.1.0

  # Calendar
  table_calendar: ^3.2.0

  # Utils
  intl: ^0.20.0
  uuid: ^4.5.0
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.0
  mockito: ^5.4.0

flutter:
  uses-material-design: true
